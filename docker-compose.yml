volumes:
  redis-data:
  bff-calendar-target:

networks:
  backend:
  user_backend:
    external: true
    name: ${USER_BACKEND_NETWORK:-bff_user_backend}

secrets:
  npmrc:
    file: .npmrc

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 4002
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_HOST: ${SHARED_DB_HOST:-postgres}
  DB_PASSWORD: password
  DB_PORT: 5432

x-depends-on: &depends-on
  redis:
    condition: service_healthy

# x-healthcheck: &healthcheck
#   test: ["CMD", "curl", "-f", "http://localhost:4002"]
#   interval: 10s
#   timeout: 5s
#   retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:latest
  pull_policy: always
  restart: always
  expose:
    - "4002"
  networks:
    - backend
  # healthcheck:
  #   <<: *healthcheck

services:
  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-calendar-bff #change bff name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # core:
