    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/health"] # <--- Doit être 3000
    #   interval: 5s
    #   timeout: 2s
    #   retries: 3
    #   start_period: 10s
      
  calendar-api:
    container_name: calendar-api-bff-calendar-developpement
    image: ghcr.io/mairie360/calendar-api:dev-d6d05a0
    ports:
      - "3002:3002"
    networks:
      - backend
      - user_backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      HOST: "0.0.0.0"
      PORT: 3002
      REDIS_URL: redis://redis:6379
      DB_TYPE: postgres
      DB_NAME: mairie_360_database
      DB_USER: postgres
      DB_HOST: ${SHARED_DB_HOST:-postgres}
      DB_PASSWORD: password
      DB_PORT: 5432
      PUBLIC_URL: http://calendar.development.mairie360.fr
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
    depends_on:
      redis:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3002/health"] # <--- Doit être 3002
    #   interval: 5s
    #   timeout: 2s
    #   retries: 3
    #   start_period: 10s
  
  #add other apis if needed

  bff-calendar:
    container_name: bff-calendar-developpement
    build:
      context: .
      dockerfile: development.Dockerfile
      args:
        - NODE_AUTH_TOKEN=${NODE_AUTH_TOKEN}
      secrets:
        - npmrc
    # Mode synchronisation en temps réel (Docker Compose V2)
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json
    ports:
      - "4002:4002"
    networks:
      - backend
      - user_backend
    environment:
      <<: *common-env
      # IMPORTANT : On utilise le nom du service Docker pour communiquer
      CORE_API_URL: "core" 
      CORE_API_PORT: 3000
      CALENDAR_API_URL: "calendar-api" 
      CALENDAR_API_PORT: 3002
      CALENDAR_API_BASE_PATH: "http://calendar-api:3002/api"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /app/node_modules # Isolation des modules pour éviter les conflits OS (Mac/Windows vs Linux)
    # depends_on:
      # core:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

