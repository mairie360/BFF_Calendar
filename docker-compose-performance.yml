# Isolated performance test stack for the BFF Calendar.
#
#   ./performance_test.sh                 (local)
#   IMAGE_REF=<image> ./performance_test.sh   (CI: the image published by release-dev)
#
# The BFF under test is never built by this file: it runs the image named by
# IMAGE_REF, which the CI sets to the dev image built once by release-dev and
# then promoted to staging and prod. When IMAGE_REF is empty, the script builds
# bff-calendar:local from development.Dockerfile first (NODE_AUTH_TOKEN and ./.npmrc
# are needed to read the @mairie360/* packages).
#
# k6-perf-test fails when a threshold of load-test.js is exceeded. load-test.js declares one
# handler per operation of contracts/openapi.json through the shared OpenAPI coverage module
# (mairie360/CICD tests/k6/coverage.js, cloned into cicd-repo/ by performance_test.sh or checked
# out by the CI job): k6 aborts at init when an operation has no handler, and fails its
# `operations_uncovered` threshold when a handler does not send its request.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:3.3.0}
    container_name: bff-calendar-perf-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:3.3.0}
    container_name: bff-calendar-perf-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: bff-calendar-perf-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
      # Volume seed of the load test (MAIR-474): Calendar_API's seed, 50 000 events over two years.
      - ./init-perf.sql:/init-perf.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql -f /init-perf.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    container_name: bff-calendar-perf-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  calendar-api:
    image: ${CALENDAR_API_IMAGE:-ghcr.io/mairie360/calendar-api:1.3.0}
    container_name: bff-calendar-perf-calendar-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Lift the API rate limit (MAIR-425): the scan and the load test hammer it as one user.
      RATE_LIMIT_PER_SECOND: "0"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3002
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://calendar-api:3002
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3002"
    networks:
      - backend
    # The published image is distroless (no shell, no curl): the calendar-api-ready container below polls
    # its /ready probe (PostgreSQL and Redis reachable), /health only says the process is up.

  calendar-api-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: bff-calendar-perf-calendar-api-ready
    depends_on:
      calendar-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://calendar-api:3002/ready >/dev/null; do
      echo "waiting for calendar-api..."; sleep 2; done; echo "calendar-api ready"'
    networks:
      - backend

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:2.3.0}
    container_name: bff-calendar-perf-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Lift the API rate limit (MAIR-425): the scan and the load test hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
      # Core refuses to start without its Resend configuration (MAIR-522). No route of this BFF sends an
      # e-mail, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      # MAIR-680: Core alone signs the session JWTs (EdDSA) with this run's Ed25519 key pair from
      # stack_secrets.sh; no JWT_SECRET, so no HS256 token is accepted anywhere in the stack.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # The published image is distroless (no shell, no curl): the core-api-ready container below polls
    # its /ready probe (PostgreSQL and Redis reachable), /health only says the process is up.

  core-api-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: bff-calendar-perf-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/ready >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend


  bff-calendar:
    image: ${IMAGE_REF:-bff-calendar:local}
    container_name: bff-calendar-perf-bff
    depends_on:
      seeder:
        condition: service_completed_successfully
      calendar-api-ready:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: 4002
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      CALENDAR_API_URL: calendar-api
      CALENDAR_API_PORT: 3002
      # Verifies the session tokens before any upstream call (bffs-lib requireSession, MAIR-474).
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4002"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  k6-perf-test:
    image: grafana/k6:latest@sha256:3e4186aea62e11a45560bfc51e19eeafe82fc07ce069c78aff44b7ff893d9a5e
    container_name: bff-calendar-perf-k6
    depends_on:
      bff-calendar:
        condition: service_healthy
    volumes:
      - ./load-test.js:/load-test.js:ro
      - ${JWT_TOKENS_FILE:?JWT_TOKENS_FILE must be set, run ./performance_test.sh}:/tokens.json:ro
      # The committed contract is the coverage reference (contracts:check keeps it equal to the
      # document served by the BFF).
      - ./contracts/openapi.json:/openapi.json:ro
      - ./cicd-repo/tests/k6/coverage.js:/coverage.js:ro
    environment:
      BASE_URL: http://bff-calendar:4002
      # EdDSA tokens of the run, signed by performance_test.sh like Core (k6 cannot sign Ed25519, MAIR-680).
      ADMIN_JWT: ${ADMIN_JWT:?ADMIN_JWT is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TOKENS_FILE: /tokens.json
      PERF_USER_ID: "2"
      # Load profile of load-test.js: `ci` (default, sized for the 4 vCPU CI runner) or `stress` (MAIR-474).
      K6_PROFILE: ${K6_PROFILE:-ci}
    command: ["run", "/load-test.js"]
    networks:
      - backend
