# Integration test stack of the BFF Calendar (MAIR-262): the same upstream services as the ZAP / k6
# stacks (published Calendar API and Core API images, seeded database, Redis) plus a `newman` runner
# that replays the committed Postman collection (tests/postman/) against the BFF over the compose network.
#
#   ./integration_test.sh                   (local: builds bff-calendar:local from development.Dockerfile)
#   IMAGE_REF=<image> ./integration_test.sh (CI: the dev-<sha> image published by release-dev)
#
# The BFF under test is never built by this file: it runs the image named by IMAGE_REF, the one
# promote-staging tests and then promotes by digest. `--bail` stops at the first failing request;
# the exit code of the newman service is what integration_test.sh returns.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:3.3.0}
    container_name: bff-calendar-int-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:3.3.0}
    container_name: bff-calendar-int-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-calendar-int-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-calendar-int-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  calendar-api:
    image: ${CALENDAR_API_IMAGE:-ghcr.io/mairie360/calendar-api:1.2.0}
    container_name: bff-calendar-int-calendar-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Lift the API rate limit (MAIR-425): the scan and the load test hammer it as one user.
      RATE_LIMIT_PER_SECOND: "0"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3002
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://calendar-api:3002
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3002"
    networks:
      - backend
    # The published image is distroless (no shell, no curl): the calendar-api-ready container below polls
    # its /ready probe (PostgreSQL and Redis reachable), /health only says the process is up.

  calendar-api-ready:
    image: curlimages/curl:latest
    container_name: bff-calendar-int-calendar-api-ready
    depends_on:
      calendar-api:
        condition: service_started
    # Bounded wait (90 tries, 3 min): an upstream that never answers fails `docker compose up` instead of
    # blocking the gate until the job timeout.
    command: >
      sh -c 'i=0; until curl -fsS http://calendar-api:3002/ready >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "calendar-api not ready after 3 min"; exit 1; fi;
      echo "waiting for calendar-api..."; sleep 2; done; echo "calendar-api ready"'
    networks:
      - backend

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:2.2.0}
    container_name: bff-calendar-int-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Lift the API rate limit (MAIR-425): the scan and the load test hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
      # Core refuses to start without its Resend configuration (MAIR-522). No route of this BFF sends an
      # e-mail, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # The published image is distroless (no shell, no curl): the core-api-ready container below polls
    # its /ready probe (PostgreSQL and Redis reachable), /health only says the process is up.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: bff-calendar-int-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    # Bounded wait (90 tries, 3 min): an upstream that never answers fails `docker compose up` instead of
    # blocking the gate until the job timeout.
    command: >
      sh -c 'i=0; until curl -fsS http://core-api:3000/ready >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "core-api not ready after 3 min"; exit 1; fi;
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend


  bff-calendar:
    image: ${IMAGE_REF:-bff-calendar:local}
    container_name: bff-calendar-int-bff
    depends_on:
      seeder:
        condition: service_completed_successfully
      calendar-api-ready:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: 4002
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      CALENDAR_API_URL: calendar-api
      CALENDAR_API_PORT: 3002
      # Verifies the session tokens before any upstream call (bffs-lib requireSession, MAIR-474).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4002"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Replays tests/postman/collection.json against the `bff-calendar` service. `baseUrl` and the JWT_SECRET
  # of the run are injected here so the committed environment stays usable from a host shell. The reports
  # (junit) land in ./newman-reports (gitignored), read by the CI job summary.
  newman:
    image: postman/newman:6.1.3-alpine
    container_name: bff-calendar-int-newman
    depends_on:
      bff-calendar:
        condition: service_healthy
    volumes:
      - ./tests/postman:/etc/newman:ro
      - ./newman-reports:/reports
    command: >
      run /etc/newman/collection.json
      --environment /etc/newman/environment.json
      --env-var baseUrl=http://bff-calendar:4002
      --env-var jwt_secret=${JWT_SECRET}
      --bail
      --reporters cli,junit
      --reporter-junit-export /reports/newman.xml
    networks:
      - backend
