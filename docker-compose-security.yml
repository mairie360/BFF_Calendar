# Stack de test de sécurité dynamique (DAST) ISOLÉE pour le BFF Calendar.
#
#   ./security_test.sh            (local)
#   docker compose -f docker-compose-security.yml up --build \
#       --abort-on-container-exit --exit-code-from security-scan   (CI)
#
# security-scan (OWASP ZAP) importe /openapi.json, rejoue chaque opération avec
# un JWT valide (replacer) et sort en échec sur toute alerte WARN/FAIL non
# neutralisée dans .zap/rules.tsv (les alertes informatives y sont passées à IGNORE).

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

secrets:
  npmrc:
    file: ./.npmrc

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:1.0.0}
    container_name: bff-calendar-sec-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:1.0.0}
    container_name: bff-calendar-sec-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-calendar-sec-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-calendar-sec-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  calendar-api:
    image: ${CALENDAR_API_IMAGE:-ghcr.io/mairie360/calendar-api:dev-d6d05a0}
    container_name: bff-calendar-sec-calendar-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3002
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://calendar-api:3002
      JWT_SECRET: secret
      JWT_TIMEOUT: 3600
    expose:
      - "3002"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur calendar-api-ready ci-dessous.

  calendar-api-ready:
    image: curlimages/curl:latest
    container_name: bff-calendar-sec-calendar-api-ready
    depends_on:
      calendar-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://calendar-api:3002/health >/dev/null; do
      echo "waiting for calendar-api..."; sleep 2; done; echo "calendar-api ready"'
    networks:
      - backend

  bff-calendar:
    image: ${TARGET_IMAGE:-bff-calendar:security}
    container_name: bff-calendar-sec-bff
    build:
      context: .
      dockerfile: development.Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
      secrets:
        - npmrc
    command: ["npx", "tsx", "src/index.ts"]
    depends_on:
      seeder:
        condition: service_completed_successfully
      calendar-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4002
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      CALENDAR_API_URL: calendar-api
      CALENDAR_API_PORT: 3002
      CALENDAR_API_BASE_PATH: http://calendar-api:3002/api
    expose:
      - "4002"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  security-scan:
    image: zaproxy/zap-stable
    container_name: bff-calendar-sec-zap
    depends_on:
      bff-calendar:
        condition: service_healthy
    volumes:
      - ./.zap/rules.tsv:/zap/wrk/rules.tsv:ro
    # -c rules.tsv : les alertes informatives sont passées à IGNORE, toute autre
    #   alerte (WARN/FAIL) fait sortir zap-api-scan.py en code != 0.
    # -z ... replacer : injecte un JWT HS256 statique (sub=2, role=user, exp=2100,
    #   signé avec JWT_SECRET=secret) sur chaque requête pour scanner les routes
    #   authentifiées /calendar/*.
    command:
      - zap-api-scan.py
      - -t
      - http://bff-calendar:4002/openapi.json
      - -f
      - openapi
      - -c
      - rules.tsv
      - -z
      - "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyIiwicm9sZSI6InVzZXIiLCJleHAiOjQxMDI0NDQ4MDB9.DQJie1tBPk6azqAcT8pEictcr77MqedlMOhOkPrK-FE"
    networks:
      - backend
